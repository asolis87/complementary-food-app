name: GGA Code Review

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize
      - reopened

# Cancel in-progress runs if new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  review:
    name: GGA Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git diff base...HEAD

      - name: Install GGA
        run: |
          echo "Installing Gentleman Guardian Angel..."
          git clone --depth 1 https://github.com/Gentleman-Programming/gentleman-guardian-angel.git /tmp/gga
          chmod +x /tmp/gga/bin/gga
          echo "/tmp/gga/bin" >> $GITHUB_PATH
          echo "GGA installed successfully"

      - name: Verify GGA installation
        run: |
          gga version
          gga config

      - name: Debug - Show files changed in PR
        run: |
          echo "==================================="
          echo "Files changed in PR (git diff):"
          echo "==================================="
          git diff --name-only ${{ github.base_ref }}...HEAD
          echo ""
          echo "==================================="
          echo "GGA will review these files:"
          echo "==================================="
          git diff --name-only ${{ github.base_ref }}...HEAD | grep -E '\.(ts|tsx|js|jsx|vue|py|go|rs|java|php|rb|cs|swift|kt|dart|html|css|scss|sass|less|json|yaml|yml|md|sql|sh|bash)$' || echo "No matching files found"
          echo ""

      - name: Run GGA PR Review
        run: |
          echo "Starting code review with GitHub Models (Claude Sonnet 4)..."
          echo "Reviewing PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          echo "Base branch: ${{ github.base_ref }}"
          echo "Head branch: ${{ github.head_ref }}"
          echo ""
          gga run --pr-mode --diff-only
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Review Summary
        if: always()
        run: |
          echo ""
          echo "==================================="
          echo "GGA Review Complete"
          echo "==================================="
          echo "PR: #${{ github.event.pull_request.number }}"
          echo "Status: ${{ job.status }}"
          echo ""
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Code review PASSED"
          else
            echo "❌ Code review FAILED - Check the logs above for violations"
          fi
