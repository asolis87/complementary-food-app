# ── Staging Deployment — Dokploy Compose ───────────────────────────────────────
# Deploy via Dokploy > Compose. Traefik handles SSL + routing automatically.
#
# Required env vars (set in Dokploy UI):
#   POSTGRES_PASSWORD, BETTER_AUTH_SECRET, STRIPE_SECRET_KEY, etc.
#   See .env.staging.example for the full list.
#
# Domain routing: configured via Dokploy UI > Domains tab (service: web, port: 80).
# Dokploy auto-injects Traefik labels + dokploy-network at deploy time.
# ───────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pakulab_staging
      POSTGRES_USER: pakulab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakulab -d pakulab_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Fastify API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://pakulab:${POSTGRES_PASSWORD}@db:5432/pakulab_staging
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in Dokploy env}
      BETTER_AUTH_URL: https://staging.pakulab.cloud
      CORS_ORIGIN: https://staging.pakulab.cloud
      FRONTEND_URL: https://staging.pakulab.cloud
      # Stripe (use test keys for staging)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
      STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY:-}
      STRIPE_SUCCESS_URL: https://staging.pakulab.cloud/billing/success
      STRIPE_CANCEL_URL: https://staging.pakulab.cloud/billing/cancel
      # Google OAuth (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

  # ── Vue PWA (Nginx) ────────────────────────────────────────────────────────
  # Domain routing configured via Dokploy UI > Domains tab.
  # Dokploy injects Traefik labels + dokploy-network automatically.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

  # ── DB Init: Schema push + Seed (run once, then exits) ─────────────────────
  # Uses the "builder" stage which has prisma CLI, tsx, and all dev deps.
  db-init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pakulab:${POSTGRES_PASSWORD}@db:5432/pakulab_staging
    command: >
      sh -c "
        echo '🔧 Applying Prisma migrations...' &&
        npx prisma migrate deploy --schema=prisma/schema.prisma ||
        (echo '⚠️  migrate deploy failed — resolving with db push + migrate resolve...' &&
         npx prisma db push --schema=prisma/schema.prisma --skip-generate --accept-data-loss &&
         npx prisma migrate resolve --schema=prisma/schema.prisma --applied 20260331165355_enable_unaccent &&
         npx prisma migrate resolve --schema=prisma/schema.prisma --applied 20260331222556_diary_meal_logging &&
         npx prisma migrate resolve --schema=prisma/schema.prisma --applied 20260331232413_simplify_food_log_single_food &&
         npx prisma migrate resolve --schema=prisma/schema.prisma --applied 20260401165908_bitacora_vision_completa &&
         npx prisma migrate resolve --schema=prisma/schema.prisma --applied 20260403120000_add_menu_meal_served_at &&
         echo '✅ Migration history resolved') &&
        echo '🌱 Seeding database with food catalog...' &&
        ./node_modules/.pnpm/node_modules/.bin/tsx prisma/seed.ts &&
        echo '✅ Database initialized successfully'
      "
    restart: "no"

volumes:
  pgdata:
