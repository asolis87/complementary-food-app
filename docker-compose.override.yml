# ── Development overrides ──────────────────────────────────────────────────────
# Automatically merged with docker-compose.yml by `docker compose up`
# Adds hot reload for both API (tsx watch) and Web (Vite HMR)

services:
  # ── Fastify API (tsx watch with hot reload) ──────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    # Override the dev command: run tsx via pnpm dlx (Docker injects env vars, --env-file not needed)
    command: ["pnpm", "--filter", "api", "dev:docker"]
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./prisma:/app/prisma
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pakulab_dev
      PORT: "3000"
      HOST: "0.0.0.0"
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5174
      FRONTEND_URL: http://localhost:5174
      BETTER_AUTH_SECRET: "docker-dev-secret-min-32-chars-ok"
      BETTER_AUTH_URL: http://localhost:3000

  # ── Vue PWA (Vite dev server with HMR) ──────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "5174:5174"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - api
    environment:
      # Proxy target (server-side, inside Docker network) — used by vite.config.ts proxy
      VITE_API_URL: http://api:3000
