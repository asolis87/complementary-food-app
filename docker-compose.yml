services:
  # ── PostgreSQL database ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pakulab_dev}
      POSTGRES_USER: ${POSTGRES_USER:-pakulab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pakulab_dev}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pakulab} -d ${POSTGRES_DB:-pakulab_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Fastify API ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pakulab}:${POSTGRES_PASSWORD:-pakulab_dev}@db:5433/${POSTGRES_DB:-pakulab_dev}
      PORT: "3000"
      CORS_ORIGIN: http://localhost:8080
    restart: unless-stopped

  # ── Vue PWA (served by nginx) ────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
