name: Generated Contract Integrity

on:
  pull_request:
    branches:
      - staging
      - "release/**"
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - staging
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-contract-integrity:
    name: Generated Contract Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: |
          set -e
          pnpm --filter @pakulab/api db:generate

      - name: Build shared package
        run: |
          set -e
          pnpm --filter @pakulab/shared build

      - name: Validate enum synchronization
        run: |
          set -e
          pnpm --filter @pakulab/api exec vitest run src/modules/foods/warning-tags-sync.test.ts src/modules/plates/plate-stage-sync.test.ts src/modules/snacks/__tests__/snack-group-sync.test.ts

      - name: Typecheck API
        run: |
          set -e
          pnpm --filter @pakulab/api typecheck

      - name: Test API
        run: |
          set -e
          pnpm --filter @pakulab/api test
        env:
          CI: "true"

      - name: Build API Docker image
        run: |
          set -e
          docker build -f apps/api/Dockerfile .
