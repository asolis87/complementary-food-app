schema: spec-driven

context: |
  Stack: Vue 3 + Vite PWA, Fastify 5, Prisma/PostgreSQL, BetterAuth, Stripe, pnpm monorepo
  Architecture: Screaming/modular monolith (9 domain modules), hexagonal per module
  Testing: vitest (api + shared), eslint 9, prettier, tsc strict
  Style: TypeScript strict ESM, no semi, single quotes, 100 print width

strict_tdd: true

testing:
  runner: vitest
  runner_command_api: pnpm --filter api vitest run
  runner_command_shared: pnpm --filter @pakulab/shared vitest run
  runner_command_web: NOT CONFIGURED
  unit: true
  unit_tool: vitest
  integration: false
  integration_tool: null
  e2e: false
  e2e_tool: null
  coverage: true
  coverage_command: vitest --coverage
  linter: eslint
  linter_command: pnpm lint
  type_checker: tsc
  type_checker_command: pnpm typecheck
  formatter: prettier
  formatter_command: pnpm format

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)