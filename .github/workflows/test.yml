name: Test

on:
  pull_request:
    branches:
      - staging
      - 'release/**'
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - staging
      - 'release/**'

# Cancel in-progress runs if new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (api + web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @pakulab/shared build

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          CI: 'true'
